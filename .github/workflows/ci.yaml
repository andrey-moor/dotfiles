name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # Mirrors `just lint`. Directory args to `nix fmt` are deprecated, so the
      # file list comes from git. spikes/ holds standalone throwaway flakes:
      # excluded from deadnix here and from statix via statix.toml.
      - name: nixfmt --check
        run: nix fmt -- --check $(git ls-files '*.nix')
      - name: statix
        run: nix run nixpkgs#statix -- check .
      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail --exclude spikes

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check --no-build --all-systems

  build-behemoth:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build .#darwinConfigurations.behemoth.system --no-link --fallback

  build-rocinante:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build .#homeConfigurations.rocinante.activationPackage --no-link --fallback

  build-stargazer:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # Eval-only: stargazer's closure includes x86_64 .deb derivations (Intune/Rosetta
      # stack) that cannot build on a stock aarch64 runner without binfmt emulation.
      # Upgrade to a full `nix build` once stargazer is rebuilt Rosetta-free.
      - run: nix eval --raw .#homeConfigurations.stargazer.activationPackage.drvPath
