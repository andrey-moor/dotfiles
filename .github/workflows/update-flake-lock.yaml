name: update-flake-lock

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        id: update
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          pr-title: "chore: weekly flake.lock update"
          pr-labels: dependencies
      - name: Enable auto-merge (waits on required checks)
        if: steps.update.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "${{ steps.update.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
