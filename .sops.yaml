keys:
  # The admin key lives on behemoth only, with a copy in 1Password.
  - &admin age13au8fs9h0p68htzmrggkq9tuc77vlv7h7d3v0n36rp33vz59ja3stlmfj3
  # stargazer's host recipient. Preferred (runbook step 3): pre-generate the
  # host key on behemoth BEFORE nixos-install and inject it into /mnt/etc/ssh,
  # so the very first boot decrypts:
  #   ssh-keygen -t ed25519 -N '' -C stargazer -f /tmp/stargazer_host_ed25519_key
  #   ssh-to-age -i /tmp/stargazer_host_ed25519_key.pub
  # Fallback (key generated by the installer): after first boot,
  #   ssh-keyscan -t ed25519 stargazer | ssh-to-age
  # Put the resulting age1... key here, then re-encrypt every file that lists
  # `*stargazer` below with the admin private key (owner-run):
  #   sops updatekeys secrets/wayvnc.yaml
  #   sops updatekeys secrets/stargazer-tenant.yaml
  #   sops updatekeys secrets/stargazer-sbctl.yaml
  #   sops updatekeys secrets/stargazer-defender.yaml
  # The whole procedure is hosts/stargazer/README.md, "Rotating the host key".
  - &stargazer age12rwzaw0r2spsgzyhhnaa9vmk9q3gel3y695wyc40qa5r44g0jcdqdf4us4
  # rocinante's own key, generated on rocinante (hosts/rocinante/README.md).
  # It decrypts the VNC passwords and nothing else.
  - &rocinante age13dn5thgp76yty5c28qw9nxvh39glxe5hkjac25eudd0vn8233qcqtx0dme
creation_rules:
  # sops uses the first rule that matches, so the narrow rule comes first.
  - path_regex: secrets/wayvnc\.yaml$
    key_groups:
      - age:
          - *admin
          - *stargazer
          - *rocinante
  # Secure Boot key, tenant facts, Defender onboarding: stargazer only.
  - path_regex: secrets/stargazer-.*\.yaml$
    key_groups:
      - age:
          - *admin
          - *stargazer
